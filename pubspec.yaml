name: cinema_app
description: "Movie Ticket Booking."
publish_to: 'none'

version: 1.0.2+4

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  flutter_launcher_icons: ^0.14.3
  carousel_slider: ^5.0.0
  flutter_animate: ^4.5.2
  webview_flutter: ^4.11.0
  barcode_widget: ^2.0.4
  connectivity_plus: ^6.1.4
  flutter_dotenv: ^6.0.0
  http: ^1.3.0
  url_launcher: ^6.3.1
  provider: ^6.1.5
  video_player: ^2.9.5
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  shimmer: ^3.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.3.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.4.0
  youtube_player_flutter: ^9.1.1
  flutter_widget_from_html: ^0.17.0
  qr_flutter: ^4.1.0
  flutter_svg: ^2.2.0
  collection: ^1.19.0
  flutter_rating_bar: ^4.0.1
  google_sign_in: 6.1.0
  sign_in_with_apple: ^7.0.1
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  firebase_crashlytics: ^5.0.3
  myfatoorah_flutter: ^3.2.3
  cached_network_image: ^3.4.1
  flutter_inappwebview: ^6.1.5






dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  build_runner: ^2.6.0
  intl_utils: ^2.8.4
  rename: ^3.0.2

flutter:
  generate: true
  uses-material-design: true

  fonts:

    - family: Intro
      fonts:
        - asset: assets/font/Intro Bold Alt.otf
          weight: 700
        - asset: assets/font/Intro Regular Alt.otf
          weight: 500
        - asset: assets/font/Intro Black Alt.otf
          weight: 900

    - family: Cairo
      fonts:
        - asset: assets/font/Cairo-Regular.ttf
          weight: 400
        - asset: assets/font/Cairo-Bold.ttf
          weight: 700
        - asset: assets/font/Cairo-Black.ttf
          weight: 900

  assets:
    - assets/images/placeholder.png
    - assets/images/placeholderbig.png
    - assets/images/popcorn.png
    - assets/images/burger.png
    - assets/images/pizza.jpeg
    - assets/images/coke.png
    - assets/images/fries.png
    - assets/images/nachos.jpg
    - assets/images/lounge.jpg
    - assets/images/sofa.jpg
    - assets/images/sofa2.png
    - assets/images/loungenew.png
    - assets/qcinemalogo.png
    - assets/images/seatsingle.svg
    - assets/images/seat2.svg
    - assets/images/seat2b.svg
    - assets/images/seatlaunge.svg
    - assets/images/seat2_selected.svg
    - assets/images/seatlaunge_selected.svg
    - assets/images/seat2_booked.svg
    - assets/images/seatlaunge_booked.svg
    - assets/images/chair.svg
    - assets/images/wheelchair.svg
    - assets/images/emptysofa_block.svg
    - assets/images/loungefinal.svg
    - assets/images/no_food.png
    - assets/images/qcwhite.png
    - assets/qclogowhite4x.png
    - assets/images/all-Thumama.jpg
    - assets/images/cinema-the-mall.jpg
    - assets/images/katara.jpg
    - assets/images/royal-plaza.jpg
    - assets/google_logo.png
    - assets/images/qcplanelogo.png
    - assets/images/qctext.png
    - assets/splash_intro.mp4
    - assets/images/featured-Image.png


flutter_native_splash:
  color: "#FF6e252e"  # fully transparent
  android: true
  ios: true
  fullscreen: true
  image: assets/qcinemalogo.png
  android_gravity: center
  ios_content_mode: center

flutter_launcher_icons:
  image_path: assets/qclogo.png
  color: "#FFFFFF"
  android: true
  remove_alpha_ios: true
  ios: true
